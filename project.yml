name: CortanaCore
options:
  bundleIdPrefix: dhia
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0"
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  CortanaCore:
    type: application
    platform: iOS
    sources: [src/CortanaCore]
    dependencies:
      - { package: mlx-swift-lm, product: MLXLLM }
      - { package: mlx-swift-lm, product: MLXLMCommon }
      - { package: mlx-swift-lm, product: MLXHuggingFace }
      - { package: swift-huggingface, product: HuggingFace }
      - { package: swift-transformers, product: Tokenizers }
    entitlements:
      path: src/CortanaCore/CortanaCore.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dhia.Cortana-Core
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: src/CortanaCore/Info.plist
      properties:
        UIAppFonts: [big_noodle_titling.ttf]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
  CortanaCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [tests/CortanaCoreTests]
    dependencies:
      - target: CortanaCore
schemes:
  CortanaCore:
    build:
      targets:
        CortanaCore: all
    test:
      targets: [CortanaCoreTests]
