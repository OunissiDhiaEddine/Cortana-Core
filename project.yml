name: CortanaCore
options:
  bundleIdPrefix: dhia
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
targets:
  CortanaCore:
    type: application
    platform: iOS
    sources: [src/CortanaCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dhia.Cortana-Core
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: src/CortanaCore/Info.plist
      properties:
        UIAppFonts: [big_noodle_titling.ttf]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
  CortanaCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [tests/CortanaCoreTests]
    dependencies:
      - target: CortanaCore
schemes:
  CortanaCore:
    build:
      targets:
        CortanaCore: all
    test:
      targets: [CortanaCoreTests]
