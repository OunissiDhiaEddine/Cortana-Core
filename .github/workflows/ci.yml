name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Test
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Simulator: $UDID"
          xcodebuild test -skipMacroValidation -skipPackagePluginValidation \
            -project CortanaCore.xcodeproj -scheme CortanaCore \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO
